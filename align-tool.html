<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widened-background alignment tool (temporary)</title>
<script src="assets/js/backgrounds.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #666; }
  .layer { position: fixed; inset: 0; background-repeat: no-repeat; }
  #panel {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(255,255,255,.95); border: 1px solid #999; border-radius: 6px;
    padding: 10px 14px; font: 13px/1.7 -apple-system, system-ui, sans-serif; width: 330px;
  }
  #panel label { display: flex; align-items: center; gap: 8px; }
  #panel label span { width: 130px; }
  #panel input[type=number] { width: 74px; }
  #panel input[type=range] { flex: 1; }
  #panel hr { border: none; border-top: 1px solid #ddd; margin: 6px 0; }
  #out { margin-top: 6px; padding: 6px 8px; background: #f0f0f0; border-radius: 4px;
         font-family: Menlo, monospace; font-size: 12px; user-select: all; white-space: pre; }
  #tips { color: #555; font-size: 11.5px; line-height: 1.5; margin-top: 6px; }
</style>
</head>
<body>
<div class="layer" id="wideL"></div>
<div class="layer" id="origL"></div>

<div id="panel">
  <b>Original (sharp layer)</b>
  <label><span>Scale S (%)</span><input type="number" id="nS" step="0.1"><input type="range" id="rS" min="40" max="250" step="0.1"></label>
  <label><span>Horiz DX (px)</span><input type="number" id="nX" step="1"><input type="range" id="rX" min="-1600" max="1600" step="1"></label>
  <label><span>Vert DY (px)</span><input type="number" id="nY" step="1"><input type="range" id="rY" min="-1200" max="1200" step="1"></label>
  <label><span>Opacity</span><input type="range" id="rO" min="0" max="100" value="100"></label>
  <hr>
  <b>Widened (dream layer)</b>
  <label><span>Stretch width (%)</span><input type="number" id="nWX" step="0.5"><input type="range" id="rWX" min="50" max="250" step="0.5"></label>
  <label><span>Stretch height (%)</span><input type="number" id="nWY" step="0.5"><input type="range" id="rWY" min="50" max="180" step="0.5"></label>
  <div id="out"></div>
  <div id="tips">
    Drag = move original &middot; Wheel = scale original (Shift = fine)<br>
    Arrows = nudge &middot; Space = blink original &middot; Resize window to re-check.<br>
    DX/DY are in screen px at this window; the SEND line is size-independent.<br>
    When happy, copy me the whole SEND line.
  </div>
</div>

<script>
(function () {
  var name = new URLSearchParams(location.search).get("img") || "thun_schlosssommer";
  var entry = null;
  ["light", "dark"].forEach(function (m) {
    (window.BACKGROUNDS[m] || []).forEach(function (e) {
      if (e.u.indexOf("/" + name + ".jpg") !== -1) entry = e;
    });
  });
  if (!entry || !entry.w) { document.body.textContent = "No widened variant for: " + name; return; }

  // Canonical units are vh (viewport-height %), so values transfer to CSS
  // identically at any window size. Panel shows px at the current window.
  var S = entry.s != null ? entry.s : 100;      // original height, % of window
  var Xvh = 0, Yvh = 0;                           // original center offset, vh
  if (entry.y != null) {                         // convert legacy P% to Yvh
    Yvh = ((entry.y / 100) * (1 - S / 100) + S / 200 - 0.5) * 100;
  }
  var WX = 100, WY = 100;                         // widened stretch factors, %

  var origL = document.getElementById("origL"), wideL = document.getElementById("wideL");
  var oImg = new Image(), wImg = new Image(), ready = 0;
  oImg.onload = wImg.onload = function () { if (++ready === 2) render(); };
  oImg.src = entry.u; wImg.src = entry.w;
  origL.style.backgroundImage = 'url("' + entry.u + '")';
  wideL.style.backgroundImage = 'url("' + entry.w + '")';

  var $ = function (id) { return document.getElementById(id); };
  var nS = $("nS"), rS = $("rS"), nX = $("nX"), rX = $("rX"), nY = $("nY"), rY = $("rY");
  var nWX = $("nWX"), rWX = $("rWX"), nWY = $("nWY"), rWY = $("rWY");

  function render() {
    if (ready < 2) return;
    var W = innerWidth, H = innerHeight;

    var hD = H * WY / 100;
    var wD = hD * (wImg.naturalWidth / wImg.naturalHeight) * WX / 100;
    wideL.style.backgroundSize = wD + "px " + hD + "px";
    wideL.style.backgroundPosition = ((W - wD) / 2) + "px " + ((H - hD) / 2) + "px";

    var Ho = H * S / 100, Wo = Ho * oImg.naturalWidth / oImg.naturalHeight;
    var cx = W / 2 + Xvh * H / 100, cy = H / 2 + Yvh * H / 100;
    origL.style.backgroundSize = Wo + "px " + Ho + "px";
    origL.style.backgroundPosition = (cx - Wo / 2) + "px " + (cy - Ho / 2) + "px";

    var wideWvh = (wImg.naturalWidth / wImg.naturalHeight) * WX / 100 * WY;
    $("out").textContent =
      "SEND: S=" + S.toFixed(1) + " X=" + Xvh.toFixed(2) + "vh Y=" + Yvh.toFixed(2) + "vh" +
      " WSIZE=" + wideWvh.toFixed(1) + "vh x " + WY.toFixed(1) + "vh\n" +
      "(here: DX=" + Math.round(Xvh * H / 100) + "px DY=" + Math.round(Yvh * H / 100) + "px" +
      " | stretch " + WX.toFixed(1) + "% x " + WY.toFixed(1) + "%)";
    sync();
  }

  function sync() {
    var H = innerHeight;
    nS.value = rS.value = S.toFixed(1);
    nX.value = rX.value = Math.round(Xvh * H / 100);
    nY.value = rY.value = Math.round(Yvh * H / 100);
    nWX.value = rWX.value = WX.toFixed(1);
    nWY.value = rWY.value = WY.toFixed(1);
  }

  [[nS, rS, function (v) { S = v; }],
   [nX, rX, function (v) { Xvh = v * 100 / innerHeight; }],
   [nY, rY, function (v) { Yvh = v * 100 / innerHeight; }],
   [nWX, rWX, function (v) { WX = v; }],
   [nWY, rWY, function (v) { WY = v; }]]
    .forEach(function (c) {
      c[0].oninput = c[1].oninput = function (e) { c[2](parseFloat(e.target.value) || 0); render(); };
    });
  $("rO").oninput = function (e) { origL.style.opacity = e.target.value / 100; };

  var drag = null;
  addEventListener("pointerdown", function (e) {
    if (e.target.closest("#panel")) return;
    drag = { x: e.clientX, y: e.clientY, X: Xvh, Y: Yvh };
  });
  addEventListener("pointermove", function (e) {
    if (!drag) return;
    Xvh = drag.X + (e.clientX - drag.x) * 100 / innerHeight;
    Yvh = drag.Y + (e.clientY - drag.y) * 100 / innerHeight;
    render();
  });
  addEventListener("pointerup", function () { drag = null; });

  addEventListener("wheel", function (e) {
    e.preventDefault();
    S = Math.max(20, S + (e.deltaY < 0 ? 1 : -1) * (e.shiftKey ? 0.1 : 0.5));
    render();
  }, { passive: false });

  addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    var f = (e.shiftKey ? 1 : 5) * 100 / innerHeight;
    if (e.code === "Space") { origL.style.opacity = origL.style.opacity === "0" ? ($("rO").value / 100) : 0; e.preventDefault(); }
    else if (e.key === "ArrowLeft") { Xvh -= f; }
    else if (e.key === "ArrowRight") { Xvh += f; }
    else if (e.key === "ArrowUp") { Yvh -= f; }
    else if (e.key === "ArrowDown") { Yvh += f; }
    else if (e.key === "+" || e.key === "=") { S += e.shiftKey ? 0.1 : 1; }
    else if (e.key === "-") { S -= e.shiftKey ? 0.1 : 1; }
    else return;
    render();
  });

  addEventListener("resize", render);
})();
</script>
</body>
</html>
