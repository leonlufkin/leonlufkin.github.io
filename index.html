  <script>/* Pre-paint: theme, background and its preloads. Identical on every page. */
(function () {
  var root = document.documentElement;
  // Light theme: the layered Monterey Bay scene (drawn by landscape.js).
  // Dark theme: the moon photograph. Nothing here depends on the page.
  var scene = { width: 1721, height: 771, minHeight: 933, edge: { sides: "#72bcf6", caps: "#9bd4fb" } };
  var moon = { u: "/assets/backgrounds/dark/home_moon2.jpg", width: 1600, height: 1200,
    edge: { sides: "#010101", caps: "#010102" }, subject: { x: 445, y: 200, width: 819, height: 810 } };
  function stored() {
    try { var t = localStorage.getItem("theme"); return t === "light" || t === "dark" ? t : null; }
    catch (e) { return null; }
  }
  function dark() {
    var t = stored();
    return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  }
  // The scene's layers come as 1x and 2x bitmaps of its source frame.
  function density() {
    var scale = Math.min(innerWidth / scene.width, innerHeight / scene.minHeight);
    return scale * Math.min(window.devicePixelRatio || 1, 2) > 1.1 ? 2 : 1;
  }
  function layers(set) {
    return ["sky", "coast", "diver"].map(function (name) {
      return "/assets/images/skydiving-" + name + "-" + set + "x.webp";
    });
  }
  function apply() {
    var theme = stored(), night = dark(), e = night ? moon : scene, style = root.style;
    var aspect = e.width / e.height, wide = Math.max(1, innerWidth) / Math.max(1, innerHeight) >= aspect;
    root.classList.toggle("dark", theme === "dark");
    root.classList.toggle("light", theme === "light");
    root.classList.toggle("has-landscape", !night);
    root.classList.toggle("has-photo", night);
    style.setProperty("--sky", e.edge[wide ? "sides" : "caps"]);
    if (!night) return;
    style.setProperty("--bg-image", 'url("' + moon.u + '")');
    style.setProperty("--photo-ratio", String(aspect));
    style.setProperty("--photo-inverse", String(1 / aspect));
    style.setProperty("--photo-seam", "linear-gradient(to " + (wide ? "right" : "bottom") +
      ", transparent, #000 var(--photo-feather), #000 calc(100% - var(--photo-feather)), transparent)");
    // Hold the moon's disc on the center of the viewport.
    style.setProperty("--photo-shift-x", String(0.5 - (moon.subject.x + moon.subject.width / 2) / moon.width));
    style.setProperty("--photo-shift-y", String(0.5 - (moon.subject.y + moon.subject.height / 2) / moon.height));
  }
  window.SiteBackground = { apply: apply, dark: dark, density: density, layers: layers, photo: moon.u };
  apply();
  (dark() ? [moon.u] : layers(density())).forEach(function (url) {
    var link = document.createElement("link");
    link.rel = "preload"; link.as = "image"; link.href = url;
    document.head.appendChild(link);
  });
})();</script>
