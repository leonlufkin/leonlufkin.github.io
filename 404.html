  <script>/* Restore a fitting session photo before paint; site.js checks the manifest. */
(function () {
  var root = document.documentElement;
  try {
    var theme = localStorage.getItem("theme");
    if (theme) root.classList.add(theme);
    var pick = JSON.parse(sessionStorage.getItem("bg") || "null");
    var mode = (theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) ? "d" : "l";
    var ratio = Math.max(1, innerWidth) / Math.max(1, innerHeight);
    if (pick && pick.v === 3 && !pick.preview && pick.m === mode && pick.viewport === ratio) {
      root.style.setProperty("--bg-image", 'url("' + pick.u + '")');
      root.style.setProperty("--sky", pick.c);
      if (pick.width > 0 && pick.height > 0) {
        var aspect = pick.width / pick.height;
        root.style.setProperty("--photo-ratio", String(aspect));
        root.style.setProperty("--photo-inverse", String(1 / aspect));
        var direction = Math.abs(ratio - aspect) < 0.000001 ? null : ratio > aspect ? "right" : "bottom";
        root.style.setProperty("--photo-seam", direction
          ? "linear-gradient(to " + direction + ", transparent, #000 var(--photo-feather), #000 calc(100% - var(--photo-feather)), transparent)"
          : "none");
      }
      if (ratio > pick.width / pick.height && pick.rows && ["left", "right"].every(function (side) {
        return typeof pick.rows[side] === "string" && pick.rows[side].indexOf("data:image/png;base64,") === 0;
      })) {
        ["left", "right"].forEach(function (side) {
          root.style.setProperty("--bg-rows-" + side, 'url("' + pick.rows[side] + '")');
        });
      }
    }
  } catch (e) {}
})();</script>
