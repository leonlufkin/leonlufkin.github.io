<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>bay-dive minimal</title>
<style>html,body{margin:0;height:100%}#c{position:fixed;inset:0;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="log" style="position:fixed;top:4px;left:4px;font:12px monospace;color:#900;background:#fff8">log</div>
<script>
const log = m => { document.getElementById('log').textContent += ' | ' + m; };
(async () => {
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl', { premultipliedAlpha: true, alpha: true });
  if (!gl) { log('no gl'); return; }
  log('gl ok');
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, 'attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }');
  gl.compileShader(vs);
  if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) { log('vs ' + gl.getShaderInfoLog(vs)); return; }
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, `precision highp float;
    uniform vec2 uRes, uPaintSize;
    uniform vec2 uDiver;
    uniform float uDiverR;
    uniform sampler2D uPaint, uMask;
    void main() {
      vec2 uv = gl_FragCoord.xy / uRes;
      vec2 tcoord = vec2(uv.x, 1.0 - uv.y);
      vec2 pc = tcoord * uPaintSize;
      vec2 d = pc - uDiver;
      float rr = length(d / vec2(uDiverR, uDiverR * 1.25));
      float disc = 1.0 - smoothstep(0.85, 1.0, rr);
      vec4 m = texture2D(uMask, clamp(tcoord, 0.0, 1.0));
      vec4 cut = texture2D(uPaint, clamp(tcoord, 0.0, 1.0));
      float diverMask = m.r * 255.0 > 1.5 && m.r * 255.0 < 2.5 ? 1.0 : 0.0;
      vec4 outc = cut * disc * diverMask;
      gl_FragColor = outc;
    }`);
  gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) { log('fs ' + gl.getShaderInfoLog(fs)); return; }
  const pr = gl.createProgram();
  gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { log('link ' + gl.getProgramInfoLog(pr)); return; }
  gl.useProgram(pr);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const tex = (unit, url) => new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => {
      const t = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, i);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      log('tex' + unit + ' ' + i.width + 'x' + i.height);
      res();
    };
    i.onerror = () => { log('img fail ' + url); rej(); };
    i.src = url;
  });
  await tex(0, '/assets/images/kea/bay-planes.png?m=' + Date.now());
  await tex(1, '/assets/images/kea/bay-mask.png?m=' + Date.now());
  const meta = await fetch('/assets/images/kea/bay.json?m=' + Date.now()).then(r => r.json());
  gl.uniform1i(gl.getUniformLocation(pr, 'uPaint'), 0);
  gl.uniform1i(gl.getUniformLocation(pr, 'uMask'), 1);
  gl.uniform2f(gl.getUniformLocation(pr, 'uPaintSize'), meta.width, meta.height);
  gl.uniform2f(gl.getUniformLocation(pr, 'uDiver'), meta.diver.x, meta.diver.y);
  gl.uniform1f(gl.getUniformLocation(pr, 'uDiverR'), meta.diver.r);
  log('uniforms set, diver ' + meta.diver.x + ',' + meta.diver.y);
  function frame() {
    const w = Math.round(innerWidth * devicePixelRatio), h = Math.round(innerHeight * devicePixelRatio);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
    gl.uniform2f(gl.getUniformLocation(pr, 'uRes'), w, h);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  log('loop running');
})();
</script>
</body>
</html>
